[project]
name = "video-converter"
# Версия задаётся только в vc/__init__.py (__VERSION__).
dynamic = ["version"]
description = "Video converter: NVENC+AAC"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mutagen>=1.48.1",
    "wxpython>=4.2.5",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]

# Сборщик нужен uv только чтобы прочитать версию из vc/__init__.py;
# сам проект в окружение не устанавливается (package = false).
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vc"]

[tool.setuptools.dynamic]
version = { attr = "vc.__VERSION__" }

[tool.uv]
package = false
